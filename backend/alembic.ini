# Alembic configuration file
# Generated for RAG Platform — async PostgreSQL (asyncpg)

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max character width for generated .py files
truncate_slug_length = 40

# SQLAlchemy URL — overridden in env.py from app settings
# (kept here as a fallback for offline mode)
sqlalchemy.url = postgresql+asyncpg://postgres:kiran@localhost:5432/RAG

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
